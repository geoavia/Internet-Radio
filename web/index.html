<!DOCTYPE HTML>
<html>

<head>
	<link rel="stylesheet" type="text/css" href="radio.css">
	<title>Internet Radio</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.2/mqttws31.min.js"></script>
	<script src="script.js"></script>
</head>

<body onload="onLoad()">
	<div class="header">
		WEB Radio<span id="status">Loading...</span>
		<img id="sleep" src="off.svg" onclick="onSleep()" class="hidden"/>
		<span id="sigvolt"></span>
	</div>
	<div id="radio" class='radio hidden'>
		<span class="label">Now Playing:&nbsp;<b><span id="sourceType"></span>&nbsp;Station</b></span>
		<div class="current">
			<div>
				<input title="Station Name" type="text" id="sourceName" onchange="onNameChange()" onfocus="onNameStart()" onblur="onNameEnd()"/>
				<img id="rename" src="edit.svg" onclick="onRename()" class="hidden"/>
				<img id="add" src="add.svg" onclick="onAdd()" class="hidden"/>
			</div>
			<div><span id="sourceTitle"></span></div>
		</div>
		<div class="volume">Volume
			<img src="vminus.svg" />
			<img src="vplus.svg" />
			<input type="range" id="sourceVol" min="0" max="0" value="0" onchange="onVolume()"/>
		</div>
		<div>
			Display:&nbsp;
			<a onclick="onDisplay(0)">Normal</a>,&nbsp;
			<a onclick="onDisplay(1)">Simple</a>,&nbsp;
			<a onclick="onDisplay(2)">Time</a>
		</div>
		<p>New Station</p>
		<div>
			<span class="label">URL/Frequency</span>
			<input title="URL/Frequency" type="text" id="urlfreq"/><button onclick="onPlay()">Play</button>
		</div>
		<p>Preset Play List</p>
		<table id="playlist">
		</table>
	</div>
</body>
</html>
