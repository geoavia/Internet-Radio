<!DOCTYPE HTML>
<html>

<head>
	<link rel="stylesheet" type="text/css" href="radio.css">
	<title>Internet Radio</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.2/mqttws31.min.js"></script>
</head>

<body>
	<div class="title">WEB Radio:<span id="status">Loading...</span><span id="sigvolt"></span></div>
	<div id="radio" class='radio hidden'>
		<div class="current">
			<div><span id="sourceType"></span> Station: <b><span id="sourceName"></span></b></div>
			<div><span id="sourceTitle"></span></div>
		</div>
		<div>
			<span>Volume:</span>
			<input type="range" id="sourceVol" min="0" max="0" value="0" onchange="onVolume()"/>
		</div>
		<div>
			Display: 
				<a onclick="onDisplay(0)">Normal</a>,
				<a onclick="onDisplay(1)">Simple</a>,
				<a onclick="onDisplay(2)">Time</a>
				<a onclick="onSleep()" class="right red">Sleep!</a>				
		</div>
		<p>Play or Add New Station</p>
		<div>
			<span class="label">URL/Frequency </span>
			<input title="URL/Frequency" type="text" id="urlfreq"/><button onclick="onPlay()">Play</button>
			<span class="label">Station Name </span>
			<input title="Station Name" type="text" id="namenew"/><button onclick="onAdd()">Add</button>
		</div>
		<p>Preset Play List</p>
		<table id="playlist">
		</table>
	</div>

	<script>

		var topic_prefix = "ggm-web-radio-2/";
		const host = "broker.emqx.io";
		const port = 8084;
		const clientid = "ggm-web-radio-control-" + parseInt(Math.random() * 1000);
		const mqtt_options = {
			useSSL: true,
			onSuccess: onConnect,
			onFailure: onFail
		}

		var listIndex;
		var listCache;
		var sigvolt = document.getElementById('sigvolt')
		var statusLabel = document.getElementById('status')
		var sourceType = document.getElementById('sourceType')
		var sourceName = document.getElementById('sourceName')
		var sourceTitle = document.getElementById('sourceTitle')
		var sourceVol = document.getElementById('sourceVol')
		var playlist = document.getElementById('playlist')
		var urlfreq = document.getElementById('urlfreq')
		var namenew = document.getElementById('namenew')
		var radio = document.getElementById('radio')

		function getStatus() {
			msg = '{ "status": 1 }';
			Message = new Paho.MQTT.Message(msg);
			Message.destinationName = topic_prefix + "command";
			client.send(Message);
		}

		function getList() {
			msg = '{ "list": 1 }';
			Message = new Paho.MQTT.Message(msg);
			Message.destinationName = topic_prefix + "command";
			client.send(Message);
		}

		function onConnect() {
			console.log("Connected");
			client.subscribe(topic_prefix + "status");
			client.subscribe(topic_prefix + "list");
			statusLabel.innerHTML = "Waiting for device..."
			setTimeout(() => {
				getStatus();	
				setTimeout(() => {
					getList();		
				}, 1000);
			}, 1000);
		}
		function onFail() {
			statusLabel.innerHTML = "Failed to connect, trying again in 5 sec..."
			console.warn(statusLabel.innerHTML)
			setTimeout(startConnect, 5000);
		}
		function onConnectionLost(responseObject) {
			console.warn("Connection lost");
			if (responseObject != 0) {
				console.error("Error: " + responseObject.errorMessage);
			}
			statusLabel.innerHTML = "Disconnected, trying again in 5 sec..."
			console.warn(statusLabel.innerHTML)
			setTimeout(startConnect, 5000);
		}
		function onMessageArrived(message) {
			show(radio)
			console.log("Message arrived: " + message.payloadString);
			if (message.destinationName == (topic_prefix + "status")) {
				try {
					const obj = JSON.parse(message.payloadString);
					statusLabel.innerHTML = obj["status"];
					sigvolt.innerHTML = parseFloat(obj["voltage"])+"v<br/>RSSI: "+obj["rssi"]+"dBm";

					sourceType.innerHTML = obj["source"].toUpperCase();
					sourceName.innerHTML = obj["name"];
					if (obj["title"]) sourceTitle.innerHTML = " (" + obj["title"] + ")";
					else sourceTitle.innerHTML = "";

					if (sourceType.innerHTML == "WEB") {
						sourceVol.max = 21;
						sourceVol.value = obj["webvol"];
					} else if (sourceType.innerHTML == "FM") {
						sourceVol.max = 30;
						sourceVol.value = obj["fmvol"];
					} else {
						sourceVol.max = 0;
						sourceVol.value = 0;
					}

				} catch (e) {
					console.log(e)
					statusLabel.innerHTML = message.payloadString
				}
			} else if (message.destinationName == (topic_prefix + "list")) {
				if (message.payloadString == "-") {
					listCache = "";
					listIndex = 0;
					playlist.classList.add('updating')
				} else if (message.payloadString == "+") {
					playlist.innerHTML = listCache;
					playlist.classList.remove('updating')
				} else {
					parts = message.payloadString.split(",");
					source = (parts[1] == "0") ? parts[2] : parts[1]
					row = ""
					if (parts[0] == "1") row += "<tr class='curr'><td>"
					else row += "<tr><td>"
					row += '<img src="up.svg" onclick="onUp('+ listIndex +')"/><div>'
					row += listIndex
					row += '</div><img src="down.svg" onclick="onDown('+ listIndex +')"/>'
					row += '</td><td class="wide" onclick="onPlay(\'' + source + '\')"><div>' + parts[3] + '</div>'
					row += "<span>"
					row += (parts[1] == "0") ? (parts[2]) : (parseFloat(parts[1]) / 10)
					row += "</span></td><td>"
					row += '<a href="#" onclick="onRemove('+ listIndex +')">Del</a>'
					row += "</td></tr>"
					listCache += row
					listIndex++;
				}
			}
		}

		function onVolume() {
			if (sourceType.innerHTML == "WEB") {
				msg = '{ "webvol": ' + sourceVol.value + ' }';
				Message = new Paho.MQTT.Message(msg);
				Message.destinationName = topic_prefix + "command";
				client.send(Message);
			} else if (sourceType.innerHTML == "FM") {
				msg = '{ "fmvol": ' + sourceVol.value + ' }';
				Message = new Paho.MQTT.Message(msg);
				Message.destinationName = topic_prefix + "command";
				client.send(Message);
			}			
		}

		function onPlay(source) {
			if (!source) 
			{
				source = urlfreq.value
				freq = parseFloat(source) * 10;
				if (freq >= 870 && freq < 1080) source = freq;
			}
			msg = '{ "play": "' + source + '" }';
			Message = new Paho.MQTT.Message(msg);
			Message.destinationName = topic_prefix + "command";
			client.send(Message);
		}

		function onAdd() {
			source = urlfreq.value
			freq = parseFloat(source) * 10;
			if (freq >= 870 && freq < 1080) source = freq;
			msg = '{ "add": "' + source + '"';
			msg += ', "name": "' + namenew.value +'" }';
			Message = new Paho.MQTT.Message(msg);
			Message.destinationName = topic_prefix + "command";
			client.send(Message);
		}

		function onUp(index) {
			msg = '{ "up": ' + index + ' }';
			Message = new Paho.MQTT.Message(msg);
			Message.destinationName = topic_prefix + "command";
			client.send(Message);
		}

		function onDown(index) {
			msg = '{ "down": ' + index + ' }';
			Message = new Paho.MQTT.Message(msg);
			Message.destinationName = topic_prefix + "command";
			client.send(Message);
		}

		function onRemove(index) {
			msg = '{ "remove": ' + index + ' }';
			Message = new Paho.MQTT.Message(msg);
			Message.destinationName = topic_prefix + "command";
			client.send(Message);
		}

		function onDisplay(mode) {
			msg = '{ "display": ' + mode + ' }';
			Message = new Paho.MQTT.Message(msg);
			Message.destinationName = topic_prefix + "command";
			client.send(Message);
		}

		function onSleep() {
			msg = '{ "sleep": 1 }';
			Message = new Paho.MQTT.Message(msg);
			Message.destinationName = topic_prefix + "command";
			client.send(Message);
			statusLabel.innerHTML = "Going to sleep..."
			setTimeout(() => { document.location.reload() }, 2000)
		}

		function startConnect() {
			console.log("Attemting to connect MQTT broker...");
			client = new Paho.MQTT.Client(host, port, clientid);
			client.onConnectionLost = onConnectionLost;
			client.onMessageArrived = onMessageArrived;
			client.connect(mqtt_options);
		}

		const hide = el => {
			el.classList.add('hidden')
		}
		const show = el => {
			el.classList.remove('hidden')
		}		

		startConnect();

	</script>


</body>

</html>
